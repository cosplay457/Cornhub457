<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>修改页面</h2>
    <p>名称：<input type="text" id="names"></p>
    <p>演员：<input type="text" id="actor"></p>
    <p>地区：<input type="text" id="area"></p>
    <p>类型：
        <select id="type">
            <!-- <option value="1">华语</option>
            <option value="2">欧美</option>
            <option value="3">韩国</option>
            <option value="4">日本</option> -->
        </select>
    </p>
    <button onclick="update()">修改电影</button>
    <script src="./axios.js"></script>
    <script>
        function renderTypes() {
            axios.get('http://127.0.0.1:8000/types/').then(res => {
                type.innerHTML = res.data.data.map(item => {
                    return `<option value="${item.id}">${item.name}</option>`
                }).join('')
            })
        }
        renderTypes()
        function update() {
            axios.patch(`http://127.0.0.1:8000/movies/${location.search}`, {
                name: names.value,
                actor: actor.value,
                area: area.value,
                type: type.value
            }).then(res => {
                if (res.data.code == 200) {
                    alert("修改成功")
                    window.open("index.html")
                }
            })
        }
        function getData() {
            axios.get(`http://127.0.0.1:8000/movies/${location.search}`).then(res => {
                let data = res.data.data[0]
                console.log(data);
                
                names.value = data.name,
                actor.value = data.actor,
                area.value = data.area,
                type.value = data.type
            })
        }
        getData()
    </script>
    </body>
    </html>
