<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #detail {
            margin: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .right {
            text-align: left;
        }
    </style>
</head>

<body>
    <h2>电影详情页面</h2>
    <div id="detail">
        
    </div>
    <script src="./axios.js"></script>
<script>
    function render(id) {
        axios.get(`http://127.0.0.1:8000/movies/${location.search}`).then(res => {
            let data = res.data.data
            console.log(data);
            detail.innerHTML = data.map(item => {
                return `
                <div id="detail">
                    <div class='left'>
                       <img src="./images/${item.id}.png">
                    </div>
                    <div class='right'>
                        <h3>电影名称: ${item.name}</h3>
                        <p>演员： ${item.actor}</p>
                        <p>地区： ${item.area}</p>
                        <p>类型: ${item.type__name}</p>
                    </div>
                </div>`
            })
        })
    }
    render()
</script>
</body>

</html>
